name: doc_scanner_sdk
description: A Flutter plugin for document scanning using ML Kit (Android) and VisionKit (iOS). Simple and native!
version: 1.0.0
homepage: https://github.com/example/doc_scanner_sdk

environment:
  sdk: '>=2.18.0 <4.0.0'
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.example.doc_scanner_sdk
        pluginClass: DocScannerSdkPlugin
      ios:
        pluginClass: DocScannerSdkPlugin
